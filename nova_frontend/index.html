     authoritative per-account value from /api/me reconciles a moment later. */

    var _t = localStorage.getItem('nova_theme');
    document.documentElement.dataset.theme = (_t === 'dark') ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
